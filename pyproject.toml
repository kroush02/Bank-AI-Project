[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-adhoc-agent"
version = "0.1.0"
description = "Gemini-assisted local bank ad-hoc reporting workflow"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.75,<2",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.2,<2",
  "sqlglot>=30.21,<31",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
bank-agent = "Adhoc_agent.cli:main"

[tool.setuptools.packages.find]
include = ["Adhoc_agent*"]

[tool.setuptools.package-data]
"Adhoc_agent.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
